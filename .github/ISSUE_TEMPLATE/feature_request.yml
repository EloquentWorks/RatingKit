name: Feature request
description: Suggest a feature or rating algorithm
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Algorithm references
      description: For mathematical changes, include authoritative papers or specifications.
