name: Bug report
description: Report incorrect behavior in Laravel RatingKit
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RatingKit version
    validations:
      required: true
  - type: input
    id: laravel
    attributes:
      label: Laravel and PHP versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include teams, ranks, algorithm, configuration, and a minimal code example.
    validations:
      required: true
